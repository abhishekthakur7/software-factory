# The one sandbox-policy entry: which OS profile each sandbox role runs
# under, where the loopback proxy's allowlist lives, and which credential
# roles may be admitted into each sandbox. Only an agent stage admits the
# runtime key; S0, S5, S6 and every build sandbox admit no role at all.
sandbox_policy:
  os_profiles:
    agent: factory/config/sandbox/agent-profile.sb
    build: factory/config/sandbox/build-profile.sb
  proxy_allowlist: factory/config/sandbox.yaml
  credential_roles:
    S0: []
    S1: [runtime_key]
    S2: [runtime_key]
    S3: [runtime_key]
    S4: [runtime_key]
    S5: []
    S6: []
    build: []
