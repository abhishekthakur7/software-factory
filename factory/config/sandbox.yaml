# The enforced sandbox: an OS-level Seatbelt boundary
# (`runner/sandbox/os_policy.py`), a loopback proxy that is the only route
# out of it (`runner/sandbox/proxy.py`), and copy-on-write base/head
# checkouts a build step writes into (`runner/sandbox/copies.py`).
# `runner/launcher.py` reads this file to build the invocation child's
# environment and to apply its OS profile; `runner/envelope.py` hashes it,
# together with the resolved proxy allowlist and environment allowlist,
# into every run's `sandbox_digest`.
policies:
  enforced:
    description: >
      A launcher-built environment allowlist plus an OS-enforced Seatbelt
      profile per sandbox role, a loopback proxy that is the only path to
      the network, and copy-on-write checkouts for a build recipe to write
      into.
    # Names the child may inherit from the launching process's own
    # environment; nothing else crosses, whatever else the launching
    # process happens to have set.
    env_allowlist:
      - PATH
      - HOME
      - LANG
      - LC_ALL
      - TMPDIR
      - JAVA_HOME
      - JDK_HOME
      - HTTPS_PROXY
      - HTTP_PROXY
      - FACTORY_PROXY_PORT
    # Started as the child's only local server when the role is `agent`
    # and this executable exists on the allowlisted PATH; otherwise the
    # launcher records that no server started rather than failing the run.
    codegraph_command: [codegraph, serve, --stdio]
    # The Seatbelt profile each sandbox role runs under, and the digest
    # `runner/sandbox/os_policy.digest` must reproduce from the file on
    # disk -- a profile edited without updating this value fails the run
    # that would use it rather than applying silently.
    os_profiles:
      agent:
        path: factory/config/sandbox/agent-profile.sb
        digest: 8e80db96e8ddbe540809e9e2151dade0c472e6dde23c083ca116d33e6e501e69
      build:
        path: factory/config/sandbox/build-profile.sb
        digest: 8810ccd3e5d325bca42a0be20287a21ac2bbc2731c17d2a6de24fe6dd2577be1
    # The one home for an external host and port a route resolves to; a
    # stage's `proxy_allowlist` entry below names route ids, never a raw
    # host, so every stage that admits `hosted_model` agrees on where it
    # points.
    endpoints:
      hosted_model:
        host: api.cursor.sh
        port: 443
      registry:
        host: pypi.org
        port: 443
      atlassian_read:
        host: api.atlassian.com
        port: 443
    # Route ids the loopback proxy tunnels to, per stage; every stage
    # absent here gets no network at all beyond the loopback proxy itself.
    # `atlassian_read` is S1 only: S1's own archaeology is the one place a
    # stage sandbox reads a Jira issue, and every other stage's absence
    # here is itself the boundary that keeps that route out of them.
    proxy_allowlist:
      S1: [hosted_model, atlassian_read]
      S2: [hosted_model]
      S3: [hosted_model]
      S4: [hosted_model]
      S5: [registry]
    # Where a build step's copy-on-write checkouts live for one stage run;
    # `runner/sandbox/copies.py` resolves the two `{...}` placeholders.
    copies:
      location: "runs/tickets/{ticket_id}/copies/{stage_run_id}"
