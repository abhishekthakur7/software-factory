# Bounded record fields (PRD section 2.2, D42). Created here for the
# tool-result inline limit; a later ticket adds this same file's
# fix-round cap entry.
tool_result_inline:
  max_lines: 200
  max_bytes: 8192
  excerpt_head_lines: 40
  excerpt_tail_lines: 20
  excerpt_max_bytes_per_end: 4096

# S2's agreement check: how many fresh child contexts restate each
# criterion.
agreement_check:
  n: 3

# A context-index entry is stale this many days after last_verified, or
# on any base-branch commit touching its paths since then.
index_staleness:
  days: 90

# The risk map's churn window, the top-author share under which a file has
# no clear owner, and the floor on how many places a plan's risk map
# section names -- unless the computed risk map itself names fewer
# candidates than that.
risk_map:
  churn_window_months: 12
  clear_owner_min_share: 0.4
  named_places: 3

# The rollout section's guardrail-metrics ceiling.
guardrail_metrics:
  max: 12

# The plan's test-strategy target mix, by count over `add` rows; reported
# in the plan-rubric summary as information, never enforced as a fail.
test_mix:
  small: 80
  medium: 15
  large: 5

# Fix rounds a ticket may take after a red machine-only S5 result; each
# round runs inside the per-ticket S4 budget.
fix_rounds:
  max_per_ticket: 2

# Verification failures a plan task may take, per approved plan-item
# version, before the ticket escalates.
verification:
  max_attempts: 3

# The wall-clock ceiling for one S1 archaeology script launch, inside the
# same sandboxed launch a real agent invocation runs under.
archaeology:
  wall_clock_seconds: 60

# The parallel ticket limit: how many tickets may be past `intake` at
# once. Stays effective at one until a recorded graduation approval binds
# a passing report and the exact hash of this file's bytes.
parallel_tickets: 1

# The graduation gate's thresholds: the smallest candidate window, the
# fewest top-level first attempts a stage needs before its pass share
# counts, the pass share a stage must exceed, the fewest comparable
# observed baseline values the revision comparison needs, and the
# severities whose attributable production incident fails the gate and
# resets the window once remediated.
graduation:
  window_min_outcomes: 10
  stage_min_first_attempts: 10
  stage_min_pass_share: 0.9
  baseline_min_comparable: 10
  severe_severities: [sev1, sev2]
