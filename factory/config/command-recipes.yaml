  - id: fixture_security
    executable: factory/scripts/checks/security_checks
    executable_digest: c74a9541996dbd8223a95d038be399b13fb0b047ec8f752ab32e2e6a4f8a847c
    args: ["--config", {placeholder: security_config, type: string}, "--rules", {placeholder: security_rules, type: string}, "--waiver-policy", {placeholder: security_waiver_policy, type: string}, "--checkout", "."]
    cwd_role: checkout
    kind: security
    stages: [checks]
    timeout_seconds: 30
    expected_exit_codes: [0]
    env_allowlist: [PATH]
    network: none
    output_retention: keep
    sandbox_inputs:
      security_config: factory/config/security-checks.yaml
      security_rules: factory/config/security-rules.yaml
      security_waiver_policy: factory/config/waiver-policy.yaml
