# The approved runtime adapters and their exact package versions and model
# lists. A model absent from an adapter's `models` list is refused before
# an invocation starts; route authority for the runtime key comes from
# `trust-profile.yaml`, never from this file -- `key_role` only names which
# environment variable the launcher fills for the `agent` sandbox role.
adapters:
  cursor_sdk:
    package: cursor-sdk
    version: "1.0.31"
    # The worker's argv, run inside the sandbox; the adapter appends the
    # envelope path and the locations path as this command's last two arguments.
    command: [python3, -m, runner.adapters.cursor_sdk_worker]
    models:
      - claude-sonnet-5
    key_role: CURSOR_API_KEY

# The scoped runtime key every agent stage's sandbox may receive: never a
# `value` field here, since `runner/credentials.py` fetches it from the
# Keychain by `role` at the moment of launch and this file only records
# the entitlement, not the secret itself. `scope` names the trust-profile
# route the key is entitled to reach -- the hosted-inference endpoint the
# loopback proxy tunnels an agent sandbox's outbound traffic to.
runtime_key:
  role: runtime_key
  scope: hosted_model
  spend_cap:
    usd_per_month: 500
  rotation:
    days: 90
