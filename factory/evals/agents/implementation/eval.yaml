subject: factory/agents/implementation.md
owner: abhishek
cases:
  - name: ok
    fixture: fixtures/ok
    expect: ok
  - name: missing_front_matter
    fixture: fixtures/missing_front_matter
    expect: reject
  # The cases below exercise `record_handback` against the hand-back this
  # same fixture carries in its own `out/handback.json` and `worktree/`,
  # not `load_definition` -- `expect` deliberately never reads "ok"/
  # "reject" so the generic agent-definition walk above leaves them alone;
  # `runner/tests/test_implementation_handback.py` walks them instead.
  - name: handback_ok
    fixture: fixtures/ok
    expect: handback_ok
  - name: handback_empty_deviations
    fixture: fixtures/empty_deviations
    expect: handback_ok
  - name: handback_missing_deviations
    fixture: fixtures/missing_deviations
    expect: handback_reject
  - name: handback_malformed_deviations
    fixture: fixtures/malformed_deviations
    expect: handback_reject
  - name: handback_no_handback
    fixture: fixtures/no_handback
    expect: handback_reject
