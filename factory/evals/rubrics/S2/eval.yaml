subject: factory/rubrics/S2.md
owner: factory_owner
cases:
  - name: ok
    fixture: fixtures/ok
    expect: ok
  - name: missing_front_matter
    fixture: fixtures/missing_front_matter
    expect: reject
  # The four cases below seed a `human_verdict` document for each bootstrap-
  # checklist grader line the rubric carries (R-S2-5, R-S2-14), one passing
  # and one failing example apiece, until a calibrated grader records these
  # for real. `expect` names the seeded verdict, not a definition-conformance
  # outcome, so the generic ok/reject walk skips these on `expect` alone.
  - name: r_s2_5_grader_pass
    fixture: fixtures/r_s2_5_grader_pass
    expect: pass
  - name: r_s2_5_grader_fail
    fixture: fixtures/r_s2_5_grader_fail
    expect: fail
  - name: r_s2_14_grader_pass
    fixture: fixtures/r_s2_14_grader_pass
    expect: pass
  - name: r_s2_14_grader_fail
    fixture: fixtures/r_s2_14_grader_fail
    expect: fail
  - name: r_s2_1_grader_pass
    fixture: fixtures/r_s2_1_grader_pass
    expect: pass
  - name: r_s2_1_grader_fail
    fixture: fixtures/r_s2_1_grader_fail
    expect: fail
  - name: r_s2_2_grader_pass
    fixture: fixtures/r_s2_2_grader_pass
    expect: pass
  - name: r_s2_2_grader_fail
    fixture: fixtures/r_s2_2_grader_fail
    expect: fail
  - name: r_s2_10_grader_pass
    fixture: fixtures/r_s2_10_grader_pass
    expect: pass
  - name: r_s2_10_grader_fail
    fixture: fixtures/r_s2_10_grader_fail
    expect: fail
  # The two cases below are the script-level EARS-form and example fixtures
  # (R-S2-1, R-S2-2): read directly by runner/tests/test_s2_criteria.py
  # rather than by the generic ok/reject walk.
  - name: ears_form_concrete
    fixture: fixtures/ears_form/concrete.md
    expect: structural_ok
  - name: ears_form_not_concrete
    fixture: fixtures/ears_form/not_concrete.md
    expect: structural_reject
