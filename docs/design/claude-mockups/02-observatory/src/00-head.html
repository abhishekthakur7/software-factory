<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Factory — Observatory</title>
<style>
/* ===== fonts ===== */
@font-face{font-family:'Geist';src:url('assets/Geist-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Geist';src:url('assets/Geist-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:block}
@font-face{font-family:'Geist';src:url('assets/Geist-SemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:block}
@font-face{font-family:'Geist Mono';src:url('assets/GeistMono-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:block}

/* ===== tokens: dark is the base ===== */
:root{
  --page:#0B0C0E; --sidebar:#08090B; --card:#121417; --card-2:#181B1F; --card-3:#1F2429;
  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.14);
  --text:#E7E9EC; --muted:#9AA1A9; --faint:#5F666E;
  --accent:#22C55E; --accent-ink:#052012;
  --pass:#22C55E; --fail:#EF4444; --warn:#F59E0B;
  --pass-s:rgba(34,197,94,.13); --fail-s:rgba(239,68,68,.13); --warn-s:rgba(245,158,11,.13);
  --accent-s:rgba(34,197,94,.13); --neutral-s:rgba(255,255,255,.07);
  --grid:rgba(255,255,255,.06); --dots:rgba(255,255,255,.10); --hov:rgba(255,255,255,.035); --sel:rgba(34,197,94,.055);
  --hatch:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 18px 44px -14px rgba(0,0,0,.75);
  --glow:.11;
}
[data-theme="light"]{
  --page:#F4F5F7; --sidebar:#FFFFFF; --card:#FFFFFF; --card-2:#F7F8FA; --card-3:#EDEFF2;
  --border:#E4E6EA; --border-2:#D2D7DD;
  --text:#14171A; --muted:#667079; --faint:#8B939C;
  --accent:#15803D; --accent-ink:#FFFFFF;
  --pass:#15803D; --fail:#DC2626; --warn:#B45309;
  --pass-s:rgba(21,128,61,.10); --fail-s:rgba(220,38,38,.09); --warn-s:rgba(180,83,9,.11);
  --accent-s:rgba(21,128,61,.10); --neutral-s:rgba(20,23,26,.055);
  --grid:rgba(20,23,26,.08); --dots:rgba(20,23,26,.13); --hov:rgba(20,23,26,.032); --sel:rgba(21,128,61,.045);
  --hatch:rgba(20,23,26,.11);
  --shadow:0 1px 2px rgba(16,20,26,.06),0 14px 34px -12px rgba(16,20,26,.18);
  --glow:.07;
}

/* ===== base ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);
  font-family:'Geist','Inter','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
input{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em}
.mut{color:var(--muted)}
.fnt{color:var(--faint)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.r{text-align:right}
.lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}

/* ===== app frame (R11) ===== */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{flex:0 0 248px;width:248px;background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 14px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px}
.brand-mark{flex:0 0 28px;width:28px;height:28px;border-radius:8px;background:var(--accent);
  color:var(--accent-ink);display:grid;place-items:center}
.brand-name{font-size:15px;font-weight:600;letter-spacing:-.02em}
.ws{display:flex;align-items:center;gap:10px;background:var(--card-2);border:1px solid var(--border);
  border-radius:10px;padding:8px 10px;margin-bottom:22px}
.ws-av{flex:0 0 26px;width:26px;height:26px;border-radius:7px;background:var(--accent-s);color:var(--accent);
  display:grid;place-items:center;font-size:12px;font-weight:600}
.ws-t{font-size:13.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws .chev{margin-left:auto;color:var(--faint);flex:0 0 14px}
.navgrp{margin-bottom:20px}
.navgrp .lbl{display:block;padding:0 10px 8px}
.nav-i{display:flex;align-items:center;gap:11px;height:44px;padding:0 10px;border-radius:10px;
  color:var(--muted);font-size:14.5px;font-weight:500;position:relative;cursor:pointer}
.nav-i svg{flex:0 0 18px;opacity:.9}
.nav-i:hover{background:var(--hov);color:var(--text)}
.nav-i.is-active{background:var(--card-3);color:var(--text)}
.nav-i.is-active::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:2px;
  border-radius:0 2px 2px 0;background:var(--accent)}
.nav-i.is-active svg{color:var(--accent);opacity:1}
.nav-b{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-s);
  border-radius:999px;padding:2px 8px;line-height:1.5}
.side-foot{margin-top:auto}
.user{display:flex;align-items:center;gap:10px;background:var(--card-2);border:1px solid var(--border);
  border-radius:10px;padding:9px 10px}
.user-av{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:var(--card-3);color:var(--text);
  display:grid;place-items:center;font-size:11.5px;font-weight:600;border:1px solid var(--border-2)}
.user-t{min-width:0;line-height:1.3}
.user-a{font-size:13.5px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-b{font-size:12px;color:var(--faint)}
.user .chev{margin-left:auto;color:var(--faint);flex:0 0 14px}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{flex:0 0 76px;height:76px;display:flex;align-items:center;gap:20px;padding:0 28px;
  border-bottom:1px solid var(--border)}
.topbar h1{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.search{flex:1 1 auto;max-width:440px;margin:0 auto;display:flex;align-items:center;gap:10px;height:42px;
  padding:0 16px;border-radius:999px;background:var(--card-2);border:1px solid var(--border);color:var(--faint)}
.search svg{flex:0 0 17px}
.search span{font-size:14px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.range{display:flex;align-items:center;gap:12px;margin-right:6px}
.runner{display:flex;align-items:center;gap:9px;height:38px;padding:0 15px 0 13px;border-radius:999px;
  background:var(--card-2);border:1px solid var(--border);font-size:13.5px;font-weight:500}
.iconbtn{width:38px;height:38px;border-radius:999px;background:var(--card-2);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--muted)}
.content{flex:1 1 auto;min-height:0;overflow:auto;padding:24px 28px 28px}

/* ===== live dot ===== */
.live{position:relative;flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.live::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--accent);opacity:.28}
.dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:currentColor}

/* ===== primitives ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:15px}
.card-h{display:flex;align-items:center;gap:10px;padding:18px 20px 14px;min-width:0;overflow:hidden}
.card-h h2{font-size:16.5px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.card-h .aux{margin-left:auto;min-width:0;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 10px;border-radius:999px;
  font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--neutral-s);color:var(--muted)}
.pill.pass{background:var(--pass-s);color:var(--pass)}
.pill.fail{background:var(--fail-s);color:var(--fail)}
.pill.warn{background:var(--warn-s);color:var(--warn)}
.pill.acc{background:var(--accent-s);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:10px;
  background:var(--card-2);border:1px solid var(--border);font-size:13.5px;font-weight:500;color:var(--text)}
.btn:hover{border-color:var(--border-2)}
.btn svg{flex:0 0 16px;color:var(--muted)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
.btn.pri svg{color:var(--accent-ink)}
.btn.off{opacity:.34;filter:saturate(.55);cursor:default}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:9px;
  background:var(--card-2);border:1px solid var(--border);font-size:13.5px;color:var(--muted)}
.chip svg{flex:0 0 14px;opacity:.8}
.chip.on{background:var(--card-3);color:var(--text);border-color:var(--border-2)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--card-2);border:1px solid var(--border)}
.seg button{height:30px;padding:0 14px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.av{flex:0 0 28px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:600;background:var(--card-3);border:1px solid var(--border-2);letter-spacing:0}
.headrow{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.headrow .right{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ===== KPI card (R14 / R15) ===== */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-bottom:20px}
.kpis>*{min-width:0}
.kpi{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--border);
  border-radius:15px;padding:20px 22px 0;height:164px}
.kpi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:104px;pointer-events:none;
  background:radial-gradient(115% 100% at 50% 100%,var(--tint,var(--accent)) 0%,transparent 72%);opacity:var(--glow)}
.kpi-top{display:flex;gap:14px;align-items:flex-start;position:relative;z-index:1}
.kpi-ic{flex:0 0 42px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--tint,var(--accent)) 14%,transparent);color:var(--tint,var(--accent))}
.kpi-l{display:block;font-size:13.5px;color:var(--muted);line-height:1.3}
.kpi-n{display:block;white-space:nowrap;font-size:36px;font-weight:600;letter-spacing:-.035em;line-height:1.15;margin-top:1px}
.kpi-n small{font-size:19px;font-weight:500;color:var(--muted);letter-spacing:-.01em}
.kpi-d{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.kpi-sp{position:absolute;left:0;right:0;bottom:0;height:52px;z-index:0}
.kpi-sp svg{width:100%;height:100%}
.sp-l{fill:none;stroke:var(--tint,var(--accent));stroke-width:1.5;opacity:.92;stroke-linejoin:round;stroke-linecap:round}
.sp-a{fill:var(--tint,var(--accent));opacity:.12;stroke:none}
@media (max-width:1540px){.r-main .kpi-ic{display:none}}
@media (max-width:1400px){.kpis{gap:14px}.kpi{padding:17px 15px 0}.kpi-ic{flex-basis:34px;width:34px;height:34px;border-radius:10px}}
.kpi.dim .sp-l{opacity:.55} .kpi.dim .sp-a{opacity:.07}
.kpi.flat .kpi-sp{height:46px} .kpi.flat .sp-a{display:none} .kpi.flat .sp-l{opacity:.6}

/* ===== generic row list ===== */
.rows{padding:0 8px 8px}
.row{display:grid;align-items:center;gap:14px;height:56px;padding:0 12px;border-radius:10px;
  border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.rowhead{display:grid;align-items:center;gap:14px;height:40px;padding:0 12px;font-size:12px;
  font-weight:500;color:var(--faint);letter-spacing:.02em;border-bottom:1px solid var(--border)}
.row.is-sel{background:var(--sel);box-shadow:inset 2px 0 0 var(--accent)}
.row.is-hov{background:var(--card-2)}

/* ===== queue ===== */
.q-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:stretch}
.q-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.qrow,.qhead{grid-template-columns:178px 74px minmax(0,1fr) 68px 10px}
.qkind{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:11px}
.qkind svg{flex:0 0 17px;width:17px;height:17px;color:var(--muted)}
.row.is-sel .qkind svg{color:var(--accent)}
.qkey{font-size:13px;color:var(--muted)}
.qtitle{font-size:14px;color:var(--muted)}
.row.is-sel .qtitle{color:var(--text)}
.qage{font-size:13px;color:var(--muted);text-align:right}
.bdot{width:8px;height:8px;border-radius:50%}
.b-1{background:var(--warn)} .b-2{background:var(--muted)} .b-3{background:var(--faint)}

.qd{padding:20px 22px 20px}
.qd-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qd-top .right{margin-left:auto;display:flex;gap:8px}
.qd h2{font-size:19px;font-weight:600;letter-spacing:-.025em;margin-bottom:5px}
.qd-meta{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.srow{display:grid;grid-template-columns:28px 210px minmax(0,1fr) auto;align-items:center;gap:13px;
  height:52px;border-top:1px solid var(--border)}
.s-n{font-size:14px;font-weight:500}
.s-r{font-size:13px;color:var(--muted)}
.s-s{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--pass)}
.ev{display:flex;align-items:center;gap:14px;height:74px;border-top:1px solid var(--border);margin-top:2px}
.ev-n{font-size:30px;font-weight:600;letter-spacing:-.035em;line-height:1}
.ev-t{line-height:1.35}
.ev-t b{display:block;font-size:14px;font-weight:500}
.ev-t span{display:block;font-size:12.5px;color:var(--muted)}
.ev-link{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--accent)}

/* ===== rail cards ===== */
.rail{display:flex;flex-direction:column;gap:20px}
.rail>.card{display:flex;flex-direction:column;overflow:hidden}
.rail>.card:nth-child(2){flex:1 1 0}
.rail>.card:nth-child(3){flex:1.35 1 0}
.gauge{display:flex;flex-direction:column;align-items:center;padding:0 10px 16px}
.gwrap{position:relative;width:100%;max-width:278px}
.gwrap svg{width:100%;height:auto;display:block}
.g-track{fill:none;stroke:var(--card-3);stroke-width:13;stroke-linecap:round}
.g-val{fill:none;stroke:var(--accent);stroke-width:13;stroke-linecap:round}
.gauge-n{position:absolute;left:0;right:0;top:63%;transform:translateY(-50%);text-align:center;
  font-size:34px;font-weight:600;letter-spacing:-.035em;line-height:1}
.gauge-l{font-size:13px;color:var(--muted);margin-top:8px}
.gauge-l b{font-weight:500;color:var(--text)}
.segbar{display:flex;gap:3px;height:12px;margin:2px 20px 0}
.segbar span{border-radius:3px}
.leg{flex:1 1 auto;padding:0 20px 12px;display:flex;flex-direction:column}
.leg-r{flex:1 1 0;display:flex;align-items:center;gap:10px;min-height:44px;font-size:13.5px}
.leg-r b{margin-left:auto;font-weight:600;font-size:14.5px}
.kgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1px;background:var(--border);
  border-top:1px solid var(--border)}
.kcell{background:var(--card);padding:14px 20px;display:flex;flex-direction:column;justify-content:center}
.kcell b{display:block;font-size:23px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.kcell span{font-size:12.5px;color:var(--muted)}

/* ===== tickets table ===== */
.trow{grid-template-columns:22px 88px minmax(0,1fr) 44px 118px 84px 76px 70px}
.tcheck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border-2)}
.tcheck.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tcheck.on svg{width:11px;height:11px}
.tkey{font-size:13.5px;font-weight:500;color:var(--muted)}
.state{font-size:13.5px;color:var(--muted)}
.row.is-sel .tkey{color:var(--accent)}
.ttitle{font-size:14px}
.stages{display:flex;gap:4px}
.stages i{width:7px;height:7px;border-radius:50%;background:var(--card-3);display:block}
.stages i.d{background:var(--pass)} .stages i.r{background:var(--fail)}
.stages i.w{background:var(--warn)} .stages i.g{background:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.bulk{position:sticky;bottom:0;margin-top:14px;display:flex;align-items:center;gap:10px;height:56px;
  padding:0 10px 0 20px;border-radius:12px;background:var(--card-3);border:1px solid var(--border-2);
  box-shadow:var(--shadow);font-size:13.5px}
.bulk .right{margin-left:auto;display:flex;gap:8px}

/* ===== ticket / run detail head (R13) ===== */
.dhead{margin-bottom:20px}
.th{display:flex;align-items:flex-start;gap:16px;padding:20px 22px 18px}
.th-key{font-size:13px;color:var(--muted);margin-bottom:5px}
.th h2{font-size:23px;font-weight:600;letter-spacing:-.03em;line-height:1.25;max-width:1010px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .right{margin-left:auto;display:flex;align-items:center;gap:10px;padding-top:14px}
.flow{padding:20px}
.flow-c{border:1px solid var(--border);border-radius:12px;background:var(--page);padding:20px 20px 22px;
  background-image:radial-gradient(var(--dots) 1.2px,transparent 1.2px);background-size:15px 15px;
  background-position:-1px -1px}
.flow-g{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;position:relative}
.stage{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden;position:relative}
.stage::after{content:"";position:absolute;top:14px;right:-15px;width:15px;height:2px;border-radius:1px;
  background:var(--border-2)}
.stage:nth-child(7)::after,.stage:nth-child(8)::after{display:none}
.st-h{display:flex;align-items:center;gap:6px;height:29px;padding:0 10px;font-size:12px;font-weight:600;
  letter-spacing:.02em;background:var(--pass-s);color:var(--pass);white-space:nowrap}
.st-h svg{width:13px;height:13px}
.st-h em{margin-left:auto;font-style:normal;font-weight:400;font-size:12px;color:var(--faint);letter-spacing:-.01em}
.st-h.w{background:var(--warn-s);color:var(--warn)}
.st-b{padding:11px 11px 12px}
.st-t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-m{font-size:12.5px;color:var(--muted);margin-top:3px}
.stage.gate{border-style:dashed;border-color:var(--border-2)}
.sub{grid-column:5 / span 2;margin-top:26px;position:relative}
.sub::before{content:"";position:absolute;left:22px;top:-28px;width:2px;height:28px;border-radius:1px;background:var(--border-2)}
.subnode{display:inline-flex;align-items:center;gap:9px;background:var(--card);border:1px dashed var(--border-2);
  border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.subnode b{font-weight:500;color:var(--text);font-size:13px}
.panels{display:grid;grid-template-columns:1.06fr 1fr;gap:20px;align-items:stretch}
.pcol{display:flex;flex-direction:column;gap:20px;min-width:0}
.pcol>.card:last-child{flex:1 1 auto}
.panels>.card{display:flex;flex-direction:column}
.panels .plist{flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-between}
.plist{padding:0 10px 10px}
.prow{display:grid;align-items:center;gap:12px;height:48px;padding:0 12px;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:0}
.arow{grid-template-columns:minmax(0,1fr) 34px 72px}
.aprow{grid-template-columns:28px minmax(0,1fr) 78px 64px}
.asrow{grid-template-columns:minmax(0,1fr) 58px;height:auto;padding:13px 12px}
.hash{font-size:12.5px;color:var(--faint);text-align:right}
.prow.old span{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--faint)}
.ver{font-size:12.5px;color:var(--muted);text-align:right}

/* ===== runs ===== */
.r-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:stretch}
.r-main{display:flex;flex-direction:column;min-width:0}
.rnrow{grid-template-columns:92px 52px minmax(0,1fr) 52px 48px 78px;gap:44px}
.stgc{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:12px;min-width:0}
.stgc>span{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbar{height:5px;border-radius:3px;background:var(--border-2);overflow:hidden}
.dbar i{display:block;height:100%;border-radius:3px;background:var(--muted);opacity:.62}
.row.is-sel .dbar i{background:var(--accent);opacity:.75}
.rid{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:8px}
.rid.kid{padding-left:22px;position:relative}
.rid.kid::before{content:"";position:absolute;left:7px;top:-16px;bottom:11px;width:9px;
  border-left:1px solid var(--border-2);border-bottom:1px solid var(--border-2);border-radius:0 0 0 4px}
.ok{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.ok i{flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:var(--pass)}
.railcard{display:flex;flex-direction:column;overflow:hidden}
.act{flex:1 1 auto;display:flex;flex-direction:column;padding:0 8px 6px}
.act-r{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:11px;align-items:center;
  height:60px;padding:0 10px;border-radius:10px;border-bottom:1px solid var(--border)}
.act-r:last-child{border-bottom:0}
.act-a{display:block;font-size:13.5px;font-weight:500}
.act-b{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.act-b span::before{content:"·";margin:0 6px;color:var(--faint)}
.act-v{display:block;text-align:right;font-size:13.5px;font-weight:500}
.act-c{display:block;text-align:right;font-size:12.5px;color:var(--muted);margin-top:2px}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px}

/* ===== run detail ===== */
.strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border)}
.strip>div{padding:17px 22px 19px;border-left:1px solid var(--border)}
.strip>div:first-child{border-left:0}
.strip .lbl{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.strip .lbl svg{width:14px;height:14px;color:var(--faint)}
.strip b{font-size:32px;font-weight:600;letter-spacing:-.035em;line-height:1.1;display:block}
.strip b small{font-size:15px;font-weight:400;color:var(--muted);letter-spacing:-.01em}
.bar{display:block;height:6px;border-radius:3px;background:var(--card-3);margin-top:12px;overflow:hidden;max-width:220px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.run-g{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:20px;align-items:stretch}
.run-g>.card{display:flex;flex-direction:column}
.steps{flex:1 1 auto;padding:8px 10px 10px;display:flex;flex-direction:column;justify-content:space-between}
.step{border-radius:12px;margin-bottom:6px}
.step:last-child{margin-bottom:0}
.step-h{display:flex;align-items:center;gap:13px;height:64px;padding:0 12px;border-radius:12px}
.step-n{flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:var(--card-2);
  border:1px solid var(--border);display:grid;place-items:center;font-size:12.5px;font-weight:500;color:var(--muted)}
.step-t{display:block;font-size:15.5px;font-weight:500}
.step-s{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.step-h .right{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--faint)}
.step-h .right .okg{color:var(--pass);display:grid;place-items:center}
.step.open{background:var(--card-2);border:1px solid var(--border)}
.step.open .step-n{background:var(--accent-s);color:var(--accent);border-color:transparent}
.step-body{padding:0 14px 16px 53px}
.blk{margin-top:10px}
.blk .lbl{display:block;margin-bottom:7px}
.blk pre{margin:0;background:var(--card-3);border:1px solid var(--border);border-radius:10px;
  padding:13px 15px;font-family:'Geist Mono',ui-monospace,monospace;font-size:13px;line-height:1.8;
  letter-spacing:-.02em;color:var(--muted);white-space:pre-wrap}
.blk pre b{font-weight:400;color:var(--text)}
.blk pre .er{color:var(--fail)} .blk pre .ok{color:var(--pass)}
.irow{grid-template-columns:96px minmax(0,1fr) 72px;height:46px}
.ikind{font-size:12.5px;color:var(--faint)}
.iname{font-size:13.5px}
.gcells{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:4px 20px 22px}
.gcell b{display:block;font-size:26px;font-weight:600;letter-spacing:-.035em;line-height:1.25}
.gcell span{font-size:12.5px;color:var(--muted)}
.log{margin:0 20px 20px;background:var(--card-3);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;line-height:1.9;
  letter-spacing:-.02em;color:var(--muted);white-space:pre;font-size:13px;line-height:1.85}
.log b{font-weight:400;color:var(--faint)}
.log em{font-style:normal;color:var(--text)}
.log .ok{color:var(--pass)} .log .er{color:var(--fail)}

/* ===== report ===== */
.base{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--faint);
  margin:-6px 0 20px;padding:0 2px}
.base b{font-weight:500;color:var(--muted)}
.rep-a{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:20px;align-items:stretch}
.rep-b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:stretch}
.rep-a>.card,.rep-b>.card{display:flex;flex-direction:column}
.rep-a .chart,.rep-b .heat{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center}
.rep-b .tools,.rep-b .mlist{flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-between}
.heat{padding:0 18px 16px}
.heat svg{width:100%;height:auto}
.mlist{padding:0 10px 10px}
.nym{grid-template-columns:minmax(0,1fr) auto;height:52px;border-top:1px solid var(--border);border-bottom:0}
.chart{padding:4px 20px 18px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.cx-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.cx-area{fill:var(--accent);opacity:.11;stroke:none}
.cx-grid{stroke:var(--grid);stroke-width:1}
.cx-med{stroke:var(--warn);stroke-width:1.25;stroke-dasharray:4 4;opacity:.85}
.tick{fill:var(--faint);font-size:11px;font-family:'Geist';letter-spacing:0}
.tick.r{text-anchor:end}
.b-p{fill:var(--pass);opacity:.92} .b-f{fill:var(--fail)} .b-o{fill:var(--faint);opacity:.7}
.donut{flex:1 1 auto;display:flex;align-items:center;gap:18px;padding:2px 18px 20px}
.donut svg{flex:0 0 168px;width:168px;height:168px;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:23}
.d-a{stroke:var(--accent)} .d-b{stroke:var(--accent);opacity:.78} .d-c{stroke:var(--accent);opacity:.62}
.d-d{stroke:var(--accent);opacity:.5} .d-e{stroke:var(--accent);opacity:.42} .d-f{stroke:var(--accent);opacity:.34}
.donut-c{position:absolute;text-align:center}
.dwrap{position:relative;flex:0 0 168px;display:grid;place-items:center}
.dwrap b{position:absolute;font-size:25px;font-weight:600;letter-spacing:-.04em;line-height:1;margin-top:-8px}
.dwrap span{position:absolute;font-size:12.5px;color:var(--muted);margin-top:22px}
.dleg{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
.dleg-r{display:flex;align-items:center;gap:10px;height:30px;font-size:13.5px}
.dleg-r i{width:9px;height:9px;border-radius:3px;background:var(--accent);flex:0 0 9px}
.dleg-r b{margin-left:auto;font-weight:500;color:var(--muted);font-size:13px}
.legend{display:flex;align-items:center;gap:13px;font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:2.5px;display:block}
.legend b{color:var(--text);font-weight:600}
.tools{padding:2px 20px 18px}
.tool{padding:12px 0 14px;border-bottom:1px solid var(--border)}
.tool:last-child{border-bottom:0}
.tool-t{display:flex;align-items:baseline;gap:10px;font-size:14px;margin-bottom:9px}
.tool-t b{margin-left:auto;font-weight:600;font-size:14.5px}
.tool-t span{color:var(--muted);font-size:13px}
.track{height:4px;border-radius:2px;background:var(--card-3);overflow:hidden}
.track i{display:block;height:100%;border-radius:2px;background:var(--accent);opacity:.85}
.mrow{grid-template-columns:minmax(0,1fr) 66px 38px 84px;height:60px}
.msp{width:84px;height:30px}
.msp svg{width:84px;height:30px}

/* ===== factory ===== */
.fhead{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.fhead h2{font-size:24px;font-weight:600;letter-spacing:-.03em}
.fhead .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.mtrow{grid-template-columns:124px 110px 34px minmax(0,1fr);gap:22px;height:54px}
.mtrow>span:first-child{white-space:nowrap}
.tier{font-size:13.5px;color:var(--muted)}
.bcell{display:grid;grid-template-columns:minmax(0,1fr) 56px;align-items:center;gap:14px}
.bcell em{font-style:normal;text-align:right;font-size:14px}
.bcell .dbar{background:var(--border-2)}
.bcell .dbar i{background:var(--accent);opacity:.55}
.swgrid{display:grid;grid-template-columns:repeat(4,1fr);padding:0 10px 6px}
.sw{display:flex;align-items:center;gap:13px;height:64px;padding:0 12px;border-left:1px solid var(--border)}
.sw:first-child{border-left:0}
.sw-t{font-size:14px}
.switch{margin-left:auto;flex:0 0 40px;width:40px;height:23px;border-radius:999px;background:var(--card-3);
  border:1px solid var(--border-2);position:relative}
.switch i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--muted)}
.switch.on{background:var(--accent);border-color:transparent}
.switch.on i{left:auto;right:2px;background:#fff}
.agents{display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.agent{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:17px 18px 16px}
.agent-n{font-size:32px;font-weight:600;letter-spacing:-.035em;line-height:1.15;margin-top:14px}
.agent-nl{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.agent-h{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.agent-h b{font-size:15px;font-weight:600;letter-spacing:-.02em;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.agent-m{font-size:12.5px;color:var(--muted)}
.kv{display:flex;align-items:center;height:30px;font-size:13px;color:var(--muted);
  border-top:1px solid var(--border)}
.kv b{margin-left:auto;font-weight:500;color:var(--text);font-size:13.5px}
.agent-f{display:flex;gap:8px;margin-top:14px}
.agent-f .btn{height:34px;padding:0 12px;font-size:13px;flex:1 1 auto;justify-content:center}

/* ==================================================================
   v3 SYSTEM LAYER  (BRIEF-v3 §3).  Documented in 02-observatory/SYSTEM.md.
   Everything below extends the classes above; nothing is renamed.
   ================================================================== */

/* --- surfaces --------------------------------------------------- */
[data-theme="light"]{--page:#F1F2F4;--sidebar:#F7F8F9}
[data-theme="light"] .card,[data-theme="light"] .kpi,[data-theme="light"] .agent,
[data-theme="light"] .stat,[data-theme="light"] .node{box-shadow:0 1px 2px rgba(16,24,40,.04)}
.inset{background:var(--card-2);border:1px solid var(--border);border-radius:12px}

/* --- emphasis border + glow (R23) -------------------------------
   The glow marks the one card that needs a person or is moving now:
   .is-live (accent + pulse dot), .is-wait (amber), .is-fail (red),
   .is-sel (accent).  .is-pass keeps a plain hairline — its full green
   progress bar and its dot-plus-word carry the outcome.             */
.is-live{--em:var(--accent)} .is-pass{--em:var(--pass)} .is-fail{--em:var(--fail)}
.is-sel{--em:var(--accent)} .is-wait{--em:var(--warn)}
.card.is-live,.card.is-fail,.card.is-sel,.card.is-wait,
.node.is-live,.node.is-fail,.node.is-sel,.node.is-wait{
  border-color:color-mix(in srgb,var(--em) 62%,transparent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--em) 8%,transparent),
             0 0 24px color-mix(in srgb,var(--em) 18%,transparent)}
[data-theme="light"] .card.is-live,[data-theme="light"] .card.is-fail,
[data-theme="light"] .card.is-sel,[data-theme="light"] .card.is-wait,
[data-theme="light"] .node.is-live,[data-theme="light"] .node.is-fail,
[data-theme="light"] .node.is-sel,[data-theme="light"] .node.is-wait{
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 0 0 4px color-mix(in srgb,var(--em) 10%,transparent)}
.card.is-pass,.node.is-pass{border-color:var(--border-2);box-shadow:none}
[data-theme="light"] .card.is-pass,[data-theme="light"] .node.is-pass{
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
/* running: the pulse dot on the icon tile is the tell against a passed card */
.is-live .node-ic,.is-live .kpi-ic{position:relative}
.is-live .node-ic::after,.is-live .kpi-ic::after{content:"";position:absolute;top:-3px;right:-3px;
  width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 2px var(--card),0 0 0 4px color-mix(in srgb,var(--accent) 40%,transparent);
  animation:sf-pulse 1.9s ease-in-out infinite}
@keyframes sf-pulse{
  0%,100%{box-shadow:0 0 0 2px var(--card),0 0 0 4px color-mix(in srgb,var(--accent) 40%,transparent)}
  55%{box-shadow:0 0 0 2px var(--card),0 0 0 7px color-mix(in srgb,var(--accent) 10%,transparent)}}

/* --- top bar (R18) ---------------------------------------------- */
.search{max-width:480px;height:44px;padding:0 8px 0 17px;gap:11px}
.search span{font-size:14px}
.kbds{margin-left:auto;display:flex;gap:5px}
.kbd{width:22px;height:22px;border-radius:6px;background:var(--card-3);border:1px solid var(--border);
  display:grid;place-items:center;font-size:11.5px;font-weight:500;color:var(--muted);line-height:1}
.tb-right{gap:10px}
.runner,.iconbtn,.rangepill{height:40px}
.iconbtn{width:40px}
.rangepill{display:inline-flex;align-items:center;gap:9px;padding:0 13px;border-radius:999px;
  background:var(--card-2);border:1px solid var(--border);font-size:13.5px;font-weight:500;white-space:nowrap}
.rangepill svg{flex:0 0 15px;color:var(--muted)}
.range .seg{height:40px;padding:4px;border-radius:999px}
.range .seg button{height:30px;border-radius:999px}
/* per-screen page actions (R18 puts them on the title row; our title is in the bar).
   The router shows the one group whose data-for matches the screen. */
.tb-actions{display:inline-flex;align-items:center;gap:10px;margin-right:4px}
.tb-actions .btn{height:40px}

/* --- buttons: every control is a pill ---------------------------- */
.btn{border-radius:999px;padding:0 16px}
.btn.off{opacity:.45;filter:none}
.btn.danger{color:var(--fail)} .btn.danger svg{color:var(--fail)}
.btn.icon{width:38px;padding:0;justify-content:center}
.chip,.fpill{height:40px;border-radius:999px;padding:0 15px;display:inline-flex;align-items:center;gap:8px;
  background:var(--card-2);border:1px solid var(--border);font-size:13.5px;color:var(--muted);white-space:nowrap}
.fpill svg{flex:0 0 14px;opacity:.8}
.fpill:hover,.chip:hover{border-color:var(--border-2)}
.seg{border-radius:999px}.seg button{border-radius:999px}
.pill{height:24px}

/* --- KPI card (R18 composition, R14 tint) ------------------------ */
.kpi{height:168px;padding:20px 22px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.kpi::after{display:none}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
.kpi-ic{flex:0 0 38px;width:38px;height:38px;border-radius:50%;background:var(--accent-s);color:var(--accent)}
.kpi-sp{position:static;flex:0 0 120px;width:120px;height:44px}
.kpi-sp svg{overflow:visible}
.sp-dot{fill:var(--card);stroke:var(--tint,var(--accent));stroke-width:1.6;vector-effect:non-scaling-stroke}
.kpi-l{font-size:14.5px;color:var(--muted);line-height:1.3}
.kpi-v{display:flex;align-items:center;gap:10px;margin-top:5px;min-width:0}
.kpi-n{font-size:clamp(30px,2.27vw,34px);line-height:1.15;margin-top:0;flex:0 0 auto}
.kpi-n small{font-size:18px}
/* the number holds its size; the delta phrase is the part that gives way */
.kpi-d{display:inline-block;height:24px;line-height:24px;padding:0 9px;border-radius:999px;margin-top:0;
  font-size:12.5px;font-weight:500;background:var(--neutral-s);color:var(--muted);white-space:nowrap;
  flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* the Runs main column is 300px narrower than a full-width KPI row */
.r-main .kpi{padding:20px 16px}
.r-main .kpi-v{gap:8px}
.r-main .kpi-n{font-size:clamp(26px,1.88vw,30px)}
.r-main .kpi-d{font-size:12px;padding:0 8px}
.kpi-d.up{background:var(--pass-s);color:var(--pass)}
.kpi-d.dn{background:var(--fail-s);color:var(--fail)}
.kpi.flat .kpi-sp{height:44px}
@media (max-width:1540px){.r-main .kpi-ic{display:grid}.r-main .kpi-sp{flex-basis:96px;width:96px}}
@media (max-width:1400px){.kpi{padding:18px 16px}.kpi-sp{flex-basis:96px;width:96px}}

/* --- stat box (R23 Started / ETA) -------------------------------- */
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px}
.stat{height:76px;border-radius:12px;border:1px solid var(--border-2);padding:0 16px;
  display:flex;flex-direction:column;justify-content:center;background:var(--card)}
.stat.pass{border-color:color-mix(in srgb,var(--pass) 45%,transparent)}
.stat.fail{border-color:color-mix(in srgb,var(--fail) 45%,transparent)}
.stat.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.stat.acc{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.stat-l{font-size:12.5px;color:var(--muted)}
.stat-v{font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1.3;display:block}
.stat-v small{font-size:13px;font-weight:400;color:var(--muted)}
.stat .bar{margin-top:7px;max-width:none;height:3px}

/* --- table shell (R18) ------------------------------------------- */
.tbl-h{display:flex;align-items:center;gap:14px;height:68px;padding:0 20px}
.tbl-t{min-width:0}
.tbl-t h2{font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.tbl-t span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.tbl-x{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.tsearch{flex:0 1 300px;height:40px;padding:0 16px;border-radius:999px;background:var(--card-2);
  border:1px solid var(--border);display:inline-flex;align-items:center;gap:10px;color:var(--faint);font-size:13.5px}
.tsearch svg{flex:0 0 16px}
.tsearch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .rowhead{height:44px;font-size:13.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.tbl .row{height:60px;font-size:14.5px}
.kebab{flex:0 0 30px;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
  display:grid;place-items:center;color:var(--faint)}
.kebab:hover{border-color:var(--border-2);color:var(--muted)}

/* --- list row for a rail (R11, R24) ------------------------------ */
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;height:60px;
  padding:0 12px;border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:0}
.lrow-a{display:block;font-size:14.5px;font-weight:500}
.lrow-b{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.lrow-v{font-size:13px;color:var(--muted);text-align:right}

/* --- node / stage card (R23) ------------------------------------- */
/* width:auto + min-width:0 so a node fills (and can shrink inside) a grid track;
   300–320 survives only as the flow-layout default. */
.node{width:auto;min-width:0;max-width:312px;flex:0 1 312px;
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.node-h{display:flex;align-items:center;gap:12px;min-width:0}
.node-ic{flex:0 0 34px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--em,var(--accent)) 14%,transparent);color:var(--em,var(--accent))}
.node-t{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.node-s{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.node-st{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:15px}
.node-st b{margin-left:auto;font-weight:500;color:var(--text)}
.prog{display:block;height:3px;border-radius:2px;background:var(--card-3);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:2px;background:var(--em,var(--accent))}

/* --- edges + dot-grid canvas (R23, R21) -------------------------- */
.canvas{position:relative;background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:20px;
  background-image:radial-gradient(var(--dots) 1.1px,transparent 1.1px);
  background-size:18px 18px;background-position:-1px -1px}
.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.edge{fill:none;stroke:color-mix(in srgb,var(--em,var(--border-2)) 60%,transparent);
  stroke-width:1.5;stroke-linecap:round}
.edge-d{fill:color-mix(in srgb,var(--em,var(--border-2)) 60%,transparent);stroke:none}

/* --- timeline (R23) ---------------------------------------------- */
.tl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px 0 2px}
.tl-i{position:relative;padding-top:28px}
.tl-i::before{content:"";position:absolute;left:6px;right:0;top:5px;height:2px;background:var(--border-2)}
.tl-i::after{content:"";position:absolute;left:0;top:0;width:12px;height:12px;border-radius:50%;background:var(--border-2)}
.tl-i.done::before,.tl-i.done::after{background:var(--accent)}
.tl-i.now::after{background:var(--accent);box-shadow:0 0 0 4px var(--accent-s)}
.tl-i:last-child::before{display:none}
.tl-t{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.015em}
.tl-m{display:block;font-size:13px;color:var(--muted);margin-top:2px}

/* --- settings row + section header (R22) ------------------------- */
.sec-h{display:flex;align-items:flex-start;gap:16px;padding-bottom:18px}
.sec-h h2{font-size:17px;font-weight:600;letter-spacing:-.02em}
.sec-h p{font-size:13.5px;color:var(--muted);margin-top:3px}
.sec-link{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;
  font-weight:500;color:var(--muted);white-space:nowrap}
.sec-link svg{flex:0 0 14px}
.sec{display:block;border-bottom:1px solid var(--border)}
.sec+.sec{margin-top:26px}
.sec:last-child{border-bottom:0}
.set{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:center;
  min-height:72px;padding:22px 0;border-top:1px solid var(--border)}
.set-l{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em}
.set-p{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.set-c{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.set-c .switch{margin-left:0}
.set-v{font-size:14.5px}
.set-f{display:flex;justify-content:flex-end;gap:10px;padding-top:20px;border-top:1px solid var(--border)}

/* --- tab row (R22, R19) ------------------------------------------ */
.tabs{display:inline-flex;align-items:center;gap:4px}
.tab{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;
  font-size:14.5px;font-weight:500;color:var(--muted)}
.tab:hover{color:var(--text)}
.tab.on{background:var(--card-3);color:var(--text)}
.tab .pill{height:20px;padding:0 8px;font-size:11.5px}

/* --- avatars (R19) ------------------------------------------------ */
.avs{display:flex;align-items:center}
.avs .av{margin-left:-8px;box-shadow:0 0 0 2px var(--card)}
.avs .av:first-child{margin-left:0}

/* --- switch (R22 shape, R09 size) --------------------------------- */
.switch{flex:0 0 44px;width:44px;height:24px}
.switch i{top:2px;left:2px;width:18px;height:18px}
</style>
</head>
