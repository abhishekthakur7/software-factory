[project]
name = "soft-factory"
version = "0.1.0"
description = "Trusted control plane of the software factory: the factory command, its stage drivers and the run record"
requires-python = ">=3.13"
dependencies = [
    "cursor-sdk==1.0.31",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
factory = "runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]

[tool.pytest.ini_options]
testpaths = ["runner/tests"]
