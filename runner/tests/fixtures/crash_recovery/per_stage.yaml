# The state each stage runs from, and any stage that must already have a
# passing run before the named stage becomes due. checks and human_review both run from
# `checks`; `factory advance` only reaches human_review once an checks pass already
# exists, so human_review's entry seeds one. implementation and checks fetch the target branch from
# the ticket's clone before running, so their entries ask for a real base;
# context_gathering asks for one too, since its own impact scan reads the ticket's worktree.
stages:
  intake:
    state: intake
  context_gathering:
    state: context
    real_base: true
  clarification:
    state: clarifying
  planning:
    state: planning
  implementation:
    state: implementing
    real_base: true
  checks:
    state: checks
    real_base: true
  human_review:
    state: checks
    prior_passes: [checks]
