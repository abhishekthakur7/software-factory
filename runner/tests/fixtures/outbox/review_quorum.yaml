# The one reviewer slot review quorum is evaluated over, and the actor
# whose approval satisfies it -- one slot, one approver, mirroring the
# pilot's single-reviewer authority (`owners.yaml`'s `packet_reviewer` role).
# The actor names the real `packet_reviewer` identity in the committed
# `owners.yaml`: `publication.quorum`'s authority check drops any
# approval whose actor no longer holds the slot's role there, so a seeded
# approval must name an identity that role really resolves to.
slot:
  source_rule: owners
  role: packet_reviewer
actor: abhishek
