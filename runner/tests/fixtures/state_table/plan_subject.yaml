# A plan tuple whose recorded base no longer equals the ticket's target
# branch head. In both scenarios the state table permits only a human-recorded
# refresh_base or send-back to move the ticket -- the gate itself
# withholds its advancing event rather than firing a redirect (see
# runner/state_table.py's module docstring).
stale_at_plan_review:
  ticket:
    - as: ticket
      state: plan_review
      target_base_sha: base-head-2
      branch: feature/two
  evidence_tuple:
    - as: plan_tuple
      kind: plan
      ticket_id: $ticket
      base_sha: base-head-old
      target_base_sha: base-head-old
      content_hash: plan-subject-2
  approval_record:
    - ticket_id: $ticket
      gate: plan
      decision: approved
      subject_hash: plan-subject-2

stale_at_implementing:
  ticket:
    - as: ticket
      state: implementing
      target_base_sha: base-head-3
      branch: feature/three
  evidence_tuple:
    - as: plan_tuple
      kind: plan
      ticket_id: $ticket
      base_sha: base-head-old
      target_base_sha: base-head-old
      content_hash: plan-subject-3
  approval_record:
    - ticket_id: $ticket
      gate: plan
      decision: approved
      subject_hash: plan-subject-3
