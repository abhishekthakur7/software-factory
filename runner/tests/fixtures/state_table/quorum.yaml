# Full plan quorum plus base/target-head equality: one
# approved approval_record bound to the plan tuple's own content hash.
plan_quorum:
  ticket:
    - as: ticket
      state: plan_review
      target_base_sha: base-head-1
      branch: feature/one
  evidence_tuple:
    - as: plan_tuple
      kind: plan
      ticket_id: $ticket
      base_sha: base-head-1
      target_base_sha: base-head-1
      content_hash: plan-subject-1
  approval_record:
    - ticket_id: $ticket
      gate: plan
      decision: approved
      subject_hash: plan-subject-1
