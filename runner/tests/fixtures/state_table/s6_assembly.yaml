# S5 and S6 both passed for the same ticket: checks_gate
# leaves `checks` only once both hold, never on S5's pass alone.
both_pass:
  ticket:
    - as: ticket
      state: checks
  stage_run:
    - ticket_id: $ticket
      stage: S5
      attempt: 1
      outcome: pass
    - ticket_id: $ticket
      stage: S6
      attempt: 1
      outcome: pass
