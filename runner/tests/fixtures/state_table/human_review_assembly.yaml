# checks and human_review both passed for the same ticket: checks_gate
# leaves `checks` only once both hold, never on checks's pass alone.
both_pass:
  ticket:
    - as: ticket
      state: checks
  stage_run:
    - ticket_id: $ticket
      stage: checks
      attempt: 1
      outcome: pass
    - ticket_id: $ticket
      stage: human_review
      attempt: 1
      outcome: pass
