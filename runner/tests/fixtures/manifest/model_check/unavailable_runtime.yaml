# A `runtime.yaml` fixture whose `cursor_sdk` adapter names no model at
# all: proves R-I-4's unavailable-model refusal fires before any
# `stage_run` opens, driven from a manifest-resolved `Entry` rather than a
# hand-built one.
adapters:
  cursor_sdk:
    package: cursor-sdk
    version: "1.0.31"
    command: [PYTHON_EXECUTABLE, WORKER_PATH]
    models: [some-other-model]
    key_role: CURSOR_API_KEY
