# an exit code outside the declared expected_exit_codes is
# recorded as a failed result.
recipes:
  - id: expected_result_test
    executable: runner/tests/fixtures/command-recipes/scripts/exit_three.py
    executable_digest: "{{DIGEST}}"
    args: []
    cwd_role: scratch
    kind: other
    stages: [implementation]
    timeout_seconds: 5
    expected_exit_codes: [0]
    env_allowlist: []
    network: none
    output_retention: discard
